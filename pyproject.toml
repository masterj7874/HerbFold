[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herbfold"
version = "0.2.0"
description = "Reproducible herbal compound discovery with AlphaFold 3 and IBM Quantum"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.11,<3", "rdkit>=2025.3,<2027", "numpy>=2.1,<3",
  "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "biopython>=1.85,<2",
  "qiskit>=2.2,<3", "qiskit-ibm-runtime>=0.42,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]
databases = ["google-crc32c==1.8.0", "zstandard==0.23.0"]

[project.scripts]
herbfold = "herbfold.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/herbfold"]

[tool.hatch.build.targets.wheel.force-include]
"data/compounds.json" = "herbfold/data/compounds.json"
"data/ptgs2.json" = "herbfold/data/ptgs2.json"
"data/molecular_references.json" = "herbfold/data/molecular_references.json"
"data/benchmarks/ptgs2_ki.json" = "herbfold/data/benchmarks/ptgs2_ki.json"

[tool.hatch.build.targets.sdist]
include = ["frontend/src", "frontend/package.json", "frontend/package-lock.json", "frontend/index.html", "frontend/tsconfig.json", "frontend/vite.config.ts", "src", "data", "docs", "scripts", "tests", "README.md", "pyproject.toml", "uv.lock", ".env.example"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["external", "runtime", "tmp", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
